name: Build NovaClient

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
          cache-disabled: true

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find . \
            -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::build.gradle bulunamadı. Proje dosyalarını deponun içine yükle."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle bulunamadı."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proje bulundu: $PROJECT_DIR"

      - name: Verify Gradle configuration
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon tasks

      - name: Build JAR
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaClient-JAR
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
